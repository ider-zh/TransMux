[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transmux"
version = "0.1.0"
description = "A thin, workspace-first translation harness for Codex and CodeBuddy"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "python-docx>=1.1,<2", "pypdf>=5,<7", "httpx>=0.27,<1", "numpy>=1.26,<3", "jsonschema>=4,<5", "python-dotenv>=1,<2", "langdetect>=1.0.9,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
local-rag = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
transmux = "transmux.app:main"
transmux-v2 = "transmux.v2:main"

[tool.setuptools.package-data]
transmux = ["static/*", "templates/*.json", "static_v2/*", "skills/*/SKILL.md"]

[tool.setuptools.packages.find]
include = ["transmux*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
