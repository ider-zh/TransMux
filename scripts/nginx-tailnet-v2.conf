# Dedicated Tailnet listener; existing LAN service remains on 192.168.1.220.
worker_processes 1;
pid nginx.pid;
error_log error.log warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;
    map $http_origin $transmux_origin_valid {
        default 0;
        "" 1;
        "http://100.64.156.74:8765" 1;
        "http://lambdax220:8765" 1;
        "http://lambdax220.tailed8a37.ts.net:8765" 1;
    }
    map $http_origin $transmux_upstream_origin {
        "" "";
        default "http://192.168.1.220:8765";
    }
    server {
        listen 100.64.156.74:8765 default_server;
        server_name _;
        return 400;
    }
    server {
        listen 100.64.156.74:8765;
        server_name 100.64.156.74 lambdax220 lambdax220.tailed8a37.ts.net;
        client_max_body_size 26m;
        if ($transmux_origin_valid = 0) { return 403; }
        location / {
            proxy_pass http://192.168.1.220:8765;
            proxy_http_version 1.1;
            proxy_set_header Host 192.168.1.220:8765;
            # Check the browser origin above before translating it for the
            # existing backend's same-origin guard. Never relax that guard.
            proxy_set_header Origin $transmux_upstream_origin;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_redirect http://192.168.1.220:8765/ /;
        }
    }
}
